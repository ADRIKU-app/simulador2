<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Créditos</title>
  <link rel="stylesheet" href="simulador_completo.css">
</head>
<body>

<header>
  <h1>Sistema Básico de Créditos</h1>
</header>

<nav>
  <button onclick="mostrarSeccion('parametros')">Parámetros</button>
  <button onclick="mostrarSeccion('clientes')">Clientes</button>
  <button onclick="mostrarSeccion('credito')">Créditos</button>
</nav>

<section id="parametros">
  <h2>Configurar Parámetros</h2>

  <label for="tasaInteres">Tasa de interés:</label>
  <input type="number" id="tasaInteres" min="10" max="20" value="15">
  <span>%</span>

  <br>
  <button onclick="guardarTasa()">Guardar tasa</button>

  <p id="mensajeTasa"></p>
</section>

<section id="clientes">
  <h2>Registro de Clientes</h2>

  <input type="text" id="txtCedula" placeholder="Ingrese la cédula">
  <input type="text" id="txtNombre" placeholder="Ingrese el nombre">
  <input type="text" id="txtApellido" placeholder="Ingrese el apellido">
  <input type="number" id="ingresos" placeholder="Ingrese los ingresos">
  <input type="number" id="egresos" placeholder="Ingrese los egresos">

  <br>

  <button onclick="guardarCliente()">Guardar cliente</button>
  <button onclick="limpiar()">Limpiar</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Ingresos</th>
        <th>Egresos</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaClientes">
    </tbody>
  </table>
</section>

<section id="credito">
  <h2>Solicitar Crédito</h2>

  <input type="text" id="buscarCedulaCredito" placeholder="Ingrese la cédula">
  <button onclick="buscarClienteCredito()">Buscar cliente</button>

  <div id="datosClienteCredito" class="card"></div>

  <input type="number" id="montoCredito" placeholder="Ingrese el monto solicitado">
  <input type="number" id="plazoCredito" placeholder="Ingrese el plazo en años">

  <br>

  <button onclick="calcularCredito()">Calcular crédito</button>

  <div id="resultadoCredito"></div>

  <button id="btnSolicitarCredito" onclick="solicitarCredito()" disabled>
    Solicitar crédito
  </button>
</section>


<script src="simulador_completo.js"></script>
<script src="utilitarios.js"></script>
<script src="funciones.js"></script>
</body>
</html>
